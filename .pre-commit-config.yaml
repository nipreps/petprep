repos:
  - repo: local
    hooks:
      - id: tox-style-fix-pre-push
        name: tox style-fix before push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        entry: |
          bash -c '
          set -euo pipefail

          if git rev-parse --verify "@{upstream}" >/dev/null 2>&1; then
            base_ref="$(git merge-base HEAD @{upstream})"
            mapfile -t py_files < <(git diff --name-only --diff-filter=ACMR "$base_ref" HEAD -- "*.py" "*.pyi")
          else
            mapfile -t py_files < <(git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- "*.py" "*.pyi" || true)
          fi

          if [ "${#py_files[@]}" -eq 0 ]; then
            echo "No Python files changed in commits to push."
            exit 0
          fi

          if command -v tox >/dev/null 2>&1; then
            tox -e style-fix -- "${py_files[@]}"
          elif command -v uvx >/dev/null 2>&1; then
            uvx --with tox-uv tox -e style-fix -- "${py_files[@]}"
          elif command -v uv >/dev/null 2>&1; then
            uv tool run --with tox-uv tox -e style-fix -- "${py_files[@]}"
          else
            echo "tox not found. Install tox or uv first."
            exit 1
          fi

          if ! git diff --quiet -- "${py_files[@]}"; then
            git add -- "${py_files[@]}"
            git commit -m "STYLE: auto-fix before push"
            echo "Auto-fix commit created. Run git push again."
            exit 1
          fi
          '
