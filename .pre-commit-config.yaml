repos:
  - repo: local
    hooks:
      - id: tox-style-fix-pre-push
        name: tox style-fix before push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        entry: |
          bash -c '
          if command -v tox >/dev/null 2>&1; then
            tox -e style-fix
          elif command -v uv >/dev/null 2>&1; then
            uv run tox -e style-fix
          else
            echo "tox not found. Install dev dependencies first."
            exit 1
          fi

          if ! git diff --quiet; then
            git add -A
            git commit -m "STYLE: auto-fix before push"
            echo "Auto-fix commit created. Run git push again."
            exit 1
          fi
          '
