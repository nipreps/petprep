default: default
parameter_sets:
  default:
    description: Baseline configuration tailored to the Hammers atlas template.
    registration:
      transforms: [Rigid, Affine, SyN]
      transform_parameters:
        - [0.05]
        - [0.05]
        - [0.01, 4.0, 0.0]
      metric:
        - Mattes
        - Mattes
        - [Mattes, CC]
      metric_weight:
        - 1
        - 1
        - [0.5, 0.5]
      radius_or_number_of_bins:
        - 32
        - 32
        - [32, 4]
      sampling_strategy:
        - Regular
        - Regular
        - [null, null]
      sampling_percentage:
        - 0.3
        - 0.3
        - [null, null]
      sigma_units: [vox, vox, vox]
      number_of_iterations:
        - [100, 100]
        - [100, 100]
        - [80, 20, 10]
      shrink_factors:
        - [2, 1]
        - [2, 1]
        - [4, 2, 1]
      smoothing_sigmas:
        - [2, 1]
        - [2, 1]
        - [1, 0.5, 0]
      use_histogram_matching: [false, false, true]
      winsorize_lower_quantile: 0.005
      winsorize_upper_quantile: 0.995
      collapse_output_transforms: true
      write_composite_transform: true
      output_transform_prefix: ants_t1_to_mni
      output_warped_image: true
      output_inverse_warped_image: true
      interpolation: LanczosWindowedSinc
      dimension: 3
      convergence_threshold: [1.0e-08, 1.0e-08, -0.01]
      convergence_window_size: [20, 20, 5]
  fast:
    description: Runtime-focused alternative for the Hammers atlas.
    registration:
      transforms: [Rigid, Affine, SyN]
      transform_parameters:
        - [0.05]
        - [0.05]
        - [0.01, 4.0, 0.0]
      metric:
        - Mattes
        - Mattes
        - [Mattes, CC]
      metric_weight:
        - 1
        - 1
        - [0.5, 0.5]
      radius_or_number_of_bins:
        - 32
        - 32
        - [32, 4]
      sampling_strategy:
        - Regular
        - Regular
        - [null, null]
      sampling_percentage:
        - 0.3
        - 0.3
        - [null, null]
      sigma_units: [vox, vox, vox]
      number_of_iterations:
        - [50, 25]
        - [50, 25]
        - [40, 15, 5]
      shrink_factors:
        - [3, 1]
        - [3, 1]
        - [3, 2, 1]
      smoothing_sigmas:
        - [2, 1]
        - [2, 1]
        - [1, 0.5, 0]
      use_histogram_matching: [false, false, true]
      winsorize_lower_quantile: 0.005
      winsorize_upper_quantile: 0.995
      collapse_output_transforms: true
      write_composite_transform: true
      output_transform_prefix: ants_t1_to_mni_fast
      output_warped_image: true
      output_inverse_warped_image: true
      interpolation: LanczosWindowedSinc
      dimension: 3
      convergence_threshold: [1.0e-07, 1.0e-07, -0.01]
      convergence_window_size: [15, 15, 5]
